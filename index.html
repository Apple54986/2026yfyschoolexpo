<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>紙屬於你的挑戰賽</title>
    <style>
        :root {
            --yfy-pink: #EC008C;      /* 核心粉色 */
            --light-pink: #F27FB2;    /* 點擊後淺粉色 */
            --energy-red: #e30505;    /* 選項使用的紅色 */
            --deep-red: #8B0000;      /* 點擊後的深紅 */
            --charcoal: #121212;
            --light-gray: #F5F5F5;
            --tech-gray: #CCCCCC;
            --white: #FFFFFF;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            font-family: 'Segoe UI', "Microsoft JhengHei", Roboto, sans-serif;
            background-color: var(--white);
            color: var(--charcoal);
            overflow: hidden; 
            user-select: none;
            touch-action: none;
        }

        #game-container {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100vh; width: 100vw;
            text-align: center;
            padding: 20px; box-sizing: border-box;
        }

        .logo-img {
            max-width: 150px;
            margin-bottom: 10px;
        }

        h1 { color: var(--yfy-pink); margin-bottom: 5px; font-size: 1.6rem; }
        h2 { color: var(--charcoal); font-size: 1.2rem; margin-bottom: 15px; line-height: 1.4; }
        
        .progress-text { font-size: 0.9rem; color: #666; margin-bottom: 10px; }

        .btn-main {
            background: linear-gradient(45deg, var(--deep-red), var(--energy-red));
            color: white; border: none;
            padding: 12px 35px; font-size: 1rem; font-weight: bold;
            border-radius: 50px; cursor: pointer;
            box-shadow: 0 4px 10px rgba(255,0,0,0.3);
            transition: transform 0.1s;
            margin-top: 10px;
        }

        /* 修改：選項區塊改成紅色 */
        .btn-option {
            background-color: var(--energy-red);
            color: white;
            border: none;
            padding: 15px 20px; font-size: 0.95rem; font-weight: 500;
            border-radius: 12px; cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            margin-bottom: 12px;
            text-align: left;
            line-height: 1.4;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .btn-option:active, .btn-option.clicked {
            background-color: var(--deep-red);
            transform: scale(0.98);
        }

        .level-screen { 
            display: none; width: 100%; height: 100%; 
            flex-direction: column; align-items: center; justify-content: center;
            animation: fadeIn 0.4s ease-out;
            overflow-y: auto;
            box-sizing: border-box;
        }
        .active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .choice-container { width: 100%; max-width: 400px; display: flex; flex-direction: column; }

        /* 結果頁面樣式 */
        .result-role { font-size: 2rem; color: var(--yfy-pink); font-weight: 900; margin: 10px 0; }
        .result-tag { background: var(--yfy-pink); color: white; padding: 5px 15px; border-radius: 5px; font-size: 1rem; margin-bottom: 15px; }
        .result-desc { text-align: left; background: var(--light-gray); padding: 20px; border-radius: 15px; font-size: 0.95rem; line-height: 1.6; max-width: 400px; }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- 進入頁 -->
        <div id="screen-start" class="level-screen active">
            <img src="yfylogo.jpg" alt="永豐餘Logo" class="logo-img" onerror="this.style.display='none'">
            <h1>紙屬於你的挑戰</h1>
            <p>探索在永豐餘中<br>屬於哪一個永續角色</p>
            <br>
            <button class="btn-main" onclick="startQuiz()">[ 開始挑戰 ]</button>
        </div>

        <!-- 題目頁面 -->
        <div id="screen-quiz" class="level-screen">
            <div class="progress-text" id="progress">Q1 / 5</div>
            <h2 id="question-text">題目載入中...</h2>
            <div class="choice-container" id="options-container">
                <!-- 選項動態生成 -->
            </div>
        </div>

        <!-- 結束頁 / 結果頁 -->
        <div id="screen-result" class="level-screen">
            <div style="font-size: 1rem; color: #666;">檢測結果</div>
            <div id="role-name" class="result-role">角色名稱</div>
            <div id="role-tag" class="result-tag">【人才類別】</div>
            <div id="role-desc" class="result-desc">特質描述載入中...</div>
            <br>
            <button class="btn-main" onclick="goToSurvey()">[ 填寫問卷領取好禮 ]</button>
        </div>
    </div>

    <script>
        const QUIZ_DATA = [
            {
                q: "最想投入的永續領域？",
                // Q1 特殊結構：拆分冒號前與後
                options: [
                    { label: "纖維研發", desc: "在永豐餘研發纖維抽絲的專業技術", type: "M" },
                    { label: "綠電開發", desc: "在永豐餘可以將餘料轉為循環電力", type: "E" },
                    { label: "智慧管理", desc: "在永豐餘可以用AI管理極大化資源效率", type: "D" }
                ]
            },
            {
                q: "在面對大自然賦予的豐富資源，請問你首選的方向？",
                options: [
                    { text: "強化纖維韌性，研發抽絲技術", type: "M" },
                    { text: "提煉木質素進行生質發電，增加發電效能", type: "E" },
                    { text: "建立產能預測數據模型，優化製程", type: "D" }
                ]
            },
            {
                q: "當你看到生產剩下的「餘料」時，最想展現哪種超能力？",
                options: [
                    { text: "物質重組：重新提煉，研發成更永續的新型環保纖維", type: "M" },
                    { text: "能量轉化：轉為強大的綠電，幫城市補給綠色能源", type: "E" },
                    { text: "AI領航：用數據預測規律，精準優化製程來達成零浪費", type: "D" }
                ]
            },
            {
                q: "最想加入智慧工廠哪個單位？",
                options: [
                    { text: "研發中心：研發生物化學並精進技術", type: "M" },
                    { text: "綠電中心：高效管控綠色發電系統", type: "E" },
                    { text: "數據中心：用機器學習預測產能及維持品質", type: "D" }
                ]
            },
            {
                q: "你認為人才最重要的特質排序？",
                options: [
                    { text: "改變物質特性的「研發力」", type: "M" },
                    { text: "建構循環系統的「整合力」", type: "E" },
                    { text: "洞察數據邏輯的「分析力」", type: "D" }
                ]
            }
        ];

        const SCORING = { M: 101, E: 100, D: 1 };
        const SURVEY_URL = "https://www.surveycake.com/s/OYYdG";

        let currentQ = 0;
        let totalScore = 0;

        function showScreen(id) {
            document.querySelectorAll('.level-screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function startQuiz() {
            currentQ = 0;
            totalScore = 0;
            showScreen('screen-quiz');
            renderQuestion();
        }

        function renderQuestion() {
            const data = QUIZ_DATA[currentQ];
            document.getElementById('progress').innerText = `Q${currentQ + 1} / 5`;
            document.getElementById('question-text').innerText = data.q;
            
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            data.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'btn-option';
                
                // Q1 初始只顯示 Label
                if (currentQ === 0) {
                    btn.innerText = opt.label;
                } else {
                    btn.innerText = opt.text;
                }

                btn.onclick = () => selectOption(opt, btn);
                container.appendChild(btn);
            });
        }

        function selectOption(opt, btnEl) {
            // 防止重複點擊
            if (btnEl.classList.contains('clicked')) return;
            
            btnEl.classList.add('clicked');
            totalScore += SCORING[opt.type];
            
            let delay = 300; // 預設跳轉時間

            // Q1 的特殊邏輯：顯示說明並停留 2 秒
            if (currentQ === 0) {
                btnEl.innerText = `${opt.label}：${opt.desc}`;
                delay = 2000; 
            }
            
            setTimeout(() => {
                currentQ++;
                if (currentQ < QUIZ_DATA.length) {
                    renderQuestion();
                } else {
                    showResult();
                }
            }, delay);
        }

        function showResult() {
            let role = "";
            let tag = "";
            let desc = "";

            if (totalScore >= 303) {
                role = "纖維魔法師 (M)";
                tag = "【材料創新人才】";
                desc = "你對物質特性有卓越洞察力，將引領材料革命！";
            } else if (totalScore >= 105) {
                role = "綠能鏈金術師 (E)";
                tag = "【能源循環人才】";
                desc = "你具備建構循環系統的宏觀思維！";
            } else {
                role = "數位預言家 (D)";
                tag = "【AI 與數據人才】";
                desc = "你習慣用數據說話，是數位轉型的關鍵人才，能將龐雜數據轉化為決策力，讓生產精準且智慧！";
            }

            document.getElementById('role-name').innerText = role;
            document.getElementById('role-tag').innerText = tag;
            document.getElementById('role-desc').innerText = desc;
            showScreen('screen-result');
        }

        function goToSurvey() {
            window.location.href = SURVEY_URL;
        }
    </script>
</body>
</html>
